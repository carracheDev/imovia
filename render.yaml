services:
  - type: web
    name: imovia-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: apps/api
    buildFilter:
      paths:
        - apps/api/**
        - render.yaml
      ignoredPaths:
        - apps/api/**/*.md
        - apps/api/**/*.spec.ts
        - apps/api/**/*.e2e-spec.ts
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.21.0
      - key: SWAGGER_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: AUTH_OTP_PEPPER
        generateValue: true
      - key: PROPERTY_AUTHORIZATION_TERMS_VERSION
        value: "1.0"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_REQUIRE_TLS
        value: "true"
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
